name: Build & Release Multi-Platform Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: TubeMerge-Windows-x64.zip
          - os: macos-latest
            platform: macos
            artifact_name: TubeMerge-macOS-x64.zip
          - os: ubuntu-22.04
            platform: linux
            artifact_name: TubeMerge-Linux-x64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev libwebkit2gtk-4.1-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Install Windows GUI Dependencies (pythonnet)
        if: runner.os == 'Windows'
        run: |
          pip install pythonnet

      - name: Install Linux GUI Bindings (GTK3 & WebKit2)
        if: runner.os == 'Linux'
        run: |
          pip install "PyGObject>=3.42.0,<3.48.0" pycairo

      - name: Build Frontend Client (Zero-Admin Mode)
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build:client

      - name: Build Desktop Executable with PyInstaller
        run: |
          python -m PyInstaller --clean --noconfirm tubemerge.spec

      # ── Platform Packaging ─────────────────────────────────────────────────
      - name: Package Windows (.zip & installer)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "dist/TubeMerge/bin"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "dist/TubeMerge/bin/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-extracted"
          Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Filter "ffmpeg.exe" | Copy-Item -Destination "dist/TubeMerge/bin/ffmpeg.exe"
          Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Filter "ffprobe.exe" | Copy-Item -Destination "dist/TubeMerge/bin/ffprobe.exe"
          Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg-extracted"
          Compress-Archive -Path dist/TubeMerge/* -DestinationPath dist/${{ matrix.artifact_name }}
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe") {
            $tag = "${{ github.ref_name }}"
            $ver = if ($tag.StartsWith("v")) { $tag.Substring(1) } else { "1.0.5" }
            & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DMyAppVersion=$ver scripts/windows_installer.iss
            # Copy to canonical TubeMerge-Setup.exe so website download URL stays evergreen
            Copy-Item -Path "dist\TubeMerge-Setup-v*.exe" -Destination "dist\TubeMerge-Setup.exe" -Force
          }

      - name: Package macOS (.app / .zip)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/TubeMerge.app/Contents/MacOS/bin
          arch=$(uname -m)
          tag="arm64"
          if [ "$arch" != "arm64" ]; then
            tag="x64"
          fi
          curl -L "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-${tag}" -o dist/TubeMerge.app/Contents/MacOS/bin/ffmpeg
          curl -L "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-${tag}" -o dist/TubeMerge.app/Contents/MacOS/bin/ffprobe
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o dist/TubeMerge.app/Contents/MacOS/bin/yt-dlp
          chmod +x dist/TubeMerge.app/Contents/MacOS/bin/*
          cd dist
          zip -r ${{ matrix.artifact_name }} TubeMerge.app
          cp ${{ matrix.artifact_name }} TubeMerge-macOS.zip
          cp ${{ matrix.artifact_name }} TubeMerge-macOS-arm64.zip

      - name: Package Linux (.tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czvf ${{ matrix.artifact_name }} TubeMerge/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-packages
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe

  release:
    name: Publish Release Packages
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
